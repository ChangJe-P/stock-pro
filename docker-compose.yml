# 단일 Django 웹 서비스와 PostgreSQL을 함께 실행하는 로컬 개발 오케스트레이션.
# 포트·호스트·DB 자격 증명·비밀값은 .env에서만 읽는다. 값을 여기에 직접 적지 않는다.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # DBeaver 등 호스트 도구가 접속할 수 있도록 DB 포트를 노출한다.
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      # DB가 실제로 준비된 뒤에만 web이 시작하도록 확인한다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    # 비밀값을 포함한 환경변수는 web 컨테이너에서만 읽는다.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # 브라우저 공개 포트는 FRONTEND_PORT, 컨테이너 내부 Django 포트는 BACKEND_PORT를 쓴다.
    # 따라서 화면과 JSON API는 같은 origin(기본 http://localhost:3000)에서 제공된다.
    ports:
      - "${FRONTEND_PORT}:${BACKEND_PORT}"

volumes:
  postgres-data:
